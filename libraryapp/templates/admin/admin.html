{% extends 'admin/master.html' %} {% block body %} <div class="container-fluid px-4 py-4">

    <h4 class="fw-bold text-primary text-uppercase mb-3 border-start border-5 border-primary ps-3">
        <i class="fa-solid fa-circle-user me-2"></i> THÔNG TIN ADMIN
    </h4>
    <div class="card card-modern p-4 mb-5 border-0 shadow-sm">
        <div class="row g-4 fs-6">
            <div class="col-md-6">
                <div class="d-flex mb-4">
                    <span class="fw-bold text-secondary" style="width: 150px;">Họ và tên:</span>
                    <span>{{ current_user.name }}</span>
                </div>
                </div>
        </div>
    </div>

    <h4 class="fw-bold text-primary text-uppercase mb-3 border-start border-5 border-primary ps-3 mt-5">
        <i class="fa-solid fa-list-ul me-2"></i> DANH SÁCH ĐỘC GIẢ MỚI
    </h4>
    <div class="card card-modern border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4"># ID</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                    </tr>
                </thead>
                <tbody>
                    {% for r in readers %}
                    <tr>
                        <td class="ps-4">#{{ r.id }}</td>
                        <td class="fw-bold text-dark">{{ r.user.name }}</td>
                        <td>{{ r.user.email }}</td>
                        <td>{{ r.user.phone }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
